<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Graphe a barres croissantes : mesure du poids des pages -->
  <g fill="url(#bars)">
    <rect x="220" y="634" width="116" height="186" rx="20"/>
    <rect x="376" y="510" width="116" height="310" rx="20"/>
    <rect x="532" y="374" width="116" height="446" rx="20"/>
    <rect x="688" y="231" width="116" height="589" rx="20"/>
  </g>

  <!-- Ligne de base (axe) -->
  <rect x="196" y="820" width="632" height="14" rx="7" fill="#64748b"/>
</svg>
