<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEO Spider</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- =====================================================================
       LAYOUT FACON SCREAMING FROG
       app
        |- topbar      : URL + Démarrer/Vider + cases + réglages repliables
        |- tabsbar     : onglets horizontaux avec compteurs
        |- workspace   : [ grille principale ] [ sidebar Overview ]
        |- détail      : panneau de détail (au clic sur une ligne)
        |- statusbar   : progression / file / débit / poids total
       ===================================================================== -->
  <div class="app">

    <!-- ----- 1) BARRE DU HAUT ------------------------------------------- -->
    <header class="topbar">
      <form id="crawl-form" class="topbar-main" autocomplete="off">
        <input
          type="url" id="seed-url" name="seed_url" list="url-history"
          class="url-input" placeholder="https://exemple.com" required />
        <datalist id="url-history"></datalist>
        <button type="submit" id="btn-start" class="btn btn--primary">Démarrer</button>
        <button type="button" id="btn-stop"  class="btn btn--danger" disabled>Stop</button>
        <button type="button" id="btn-clear" class="btn">Vider</button>
        <button type="button" id="btn-import" class="btn"
                title="Importer un fichier .txt ou .csv contenant une URL par ligne. Chaque site sera crawlé INTÉGRALEMENT, l'un après l'autre.">
          Importer une liste
        </button>
        <span class="import-badge" id="import-badge" hidden></span>

        <label class="topbar-check" title="Crawler tout le site, sans limite de pages">
          <input type="checkbox" id="opt-unlimited" checked />
          <span>Tout le site</span>
        </label>
        <label class="topbar-check" title="Respecter les règles du fichier robots.txt">
          <input type="checkbox" id="opt-robots" checked />
          <span>Respecter robots.txt</span>
        </label>

        <button type="button" id="btn-toggle-settings" class="btn btn--ghost btn--sm" aria-expanded="false">
          Réglages
        </button>

        <!-- Info réseau (IP publique + reverse DNS) poussée à droite -->
        <span class="net-info" id="net-info" title="IP publique sortante + reverse DNS">
          <span class="net-dot"></span>
          <span id="net-info-text">IP...</span>
        </span>
      </form>

      <!-- Volet de réglages repliable -->
      <div class="settings-drawer" id="settings-drawer" hidden>
        <div class="setting">
          <label for="max-pages">Pages max</label>
          <input type="number" id="max-pages" class="setting-num" value="500" min="1" max="1000000" data-last="500" />
        </div>
        <div class="setting">
          <label for="max-depth">Profondeur max</label>
          <input type="number" id="max-depth" value="10" min="1" max="50" />
        </div>
        <div class="setting" title="Débit maximal : cadence d'envoi des requêtes (plafond anti-surcharge serveur). Ce plafond est GLOBAL : tant qu'il est actif, ajouter des threads ne change rien.">
          <label for="rps">Req / sec</label>
          <input type="number" id="rps" value="5" min="1" max="50" step="1" />
        </div>
        <div class="setting" title="Nombre de pages telechargees EN PARALLELE (workers simultanes)">
          <label for="threads">Threads</label>
          <input type="number" id="threads" value="5" min="1" max="50" step="1" />
        </div>
        <label class="setting setting--check" title="Supprime le plafond de débit : la vitesse n'est plus bornée que par les threads et le temps de réponse du serveur (comportement Screaming Frog). Attention a ne pas saturer un serveur mutualise.">
          <input type="checkbox" id="no-rate-limit" />
          <span>Débit illimité</span>
        </label>
        <label class="setting setting--check" title="Délais aléatoires entre requêtes (comportement humain). Incompatible avec le débit illimité.">
          <input type="checkbox" id="random-rps" />
          <span>Débit aléatoire</span>
        </label>
        <label class="setting setting--check" title="Mesure chaque page via Chrome headless (bande passante RÉELLE : XHR, images lazy, invocations serverless). Nécessaire pour les SPA React/Vue, qui ne declenchent plus Chrome automatiquement — la mesure Chrome est serialisee (un seul navigateur), donc lente sur un gros crawl.">
          <input type="checkbox" id="force-chrome" />
          <span>Forcer Chrome</span>
        </label>
        <label class="setting setting--check">
          <input type="checkbox" id="random-ua" />
          <span>UA aléatoire</span>
        </label>
        <div class="setting setting--dir">
          <label for="save-dir">Dossier des projets</label>
          <div class="setting-dir-row">
            <input type="text" id="save-dir" class="dir-input" placeholder="(defaut : données de l'app)" spellcheck="false" />
            <button type="button" id="btn-pick-folder" class="btn btn--sm" title="Choisir le dossier où enregistrer les projets">Choisir…</button>
            <button type="button" id="btn-open-project" class="btn btn--sm" title="Ouvrir un projet enregistré (.json)">Ouvrir un projet</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ----- 2) BARRE D'ONGLETS ----------------------------------------- -->
    <nav class="tabsbar" id="tabsbar" role="tablist">
      <button type="button" class="tab is-active" data-tab="internal" role="tab">
        Internal <span class="tab-count" data-count="internal">0</span>
      </button>
      <button type="button" class="tab" data-tab="response" role="tab">
        Response Codes <span class="tab-count" data-count="response">0</span>
      </button>
      <button type="button" class="tab" data-tab="url" role="tab">
        URL <span class="tab-count" data-count="url">0</span>
      </button>
      <button type="button" class="tab" data-tab="security" role="tab">
        Sécurité <span class="tab-count" data-count="security">0</span>
      </button>
      <button type="button" class="tab" data-tab="titles" role="tab">
        Page Titles <span class="tab-count" data-count="titles">0</span>
      </button>
      <button type="button" class="tab" data-tab="meta" role="tab">
        Meta Description <span class="tab-count" data-count="meta">0</span>
      </button>
      <button type="button" class="tab" data-tab="h1" role="tab">
        H1 <span class="tab-count" data-count="h1">0</span>
      </button>
      <button type="button" class="tab" data-tab="content" role="tab">
        Contenu <span class="tab-count" data-count="content">0</span>
      </button>
      <button type="button" class="tab" data-tab="images" role="tab">
        Images <span class="tab-count" data-count="images">0</span>
      </button>
      <button type="button" class="tab" data-tab="canonical" role="tab">
        Canonicals <span class="tab-count" data-count="canonical">0</span>
      </button>
      <button type="button" class="tab" data-tab="directives" role="tab">
        Directives <span class="tab-count" data-count="directives">0</span>
      </button>
      <button type="button" class="tab" data-tab="hreflang" role="tab">
        Hreflang <span class="tab-count" data-count="hreflang">0</span>
      </button>
      <button type="button" class="tab" data-tab="pagination" role="tab">
        Pagination <span class="tab-count" data-count="pagination">0</span>
      </button>
      <button type="button" class="tab" data-tab="schema" role="tab">
        Structured Data <span class="tab-count" data-count="schema">0</span>
      </button>
      <button type="button" class="tab" data-tab="links" role="tab">
        Liens <span class="tab-count" data-count="links">0</span>
      </button>
      <button type="button" class="tab" data-tab="issues" role="tab">
        Problèmes <span class="tab-count" data-count="issues">0</span>
      </button>
      <button type="button" class="tab" data-tab="sitemap" role="tab">
        Sitemap <span class="tab-count" data-count="sitemap">0</span>
      </button>
      <button type="button" class="tab" data-tab="bandwidth" role="tab">
        Bande passante <span class="tab-count" data-count="bandwidth">0</span>
      </button>
    </nav>

    <!-- ----- Barre d'outils de la grille (filtre + filtres sev + export) - -->
    <div class="gridtools">
      <input type="search" id="grid-search" class="grid-search"
             placeholder="Filtrer par URL..." autocomplete="off" />

      <!-- Filtres de sévérité : visibles seulement sur l'onglet Problèmes -->
      <div class="sev-filters" id="sev-filters" hidden>
        <button type="button" class="sev-filter is-active" data-sev="all">Tous <span data-sevcount="all">0</span></button>
        <button type="button" class="sev-filter" data-sev="critical">Critiques <span data-sevcount="critical">0</span></button>
        <button type="button" class="sev-filter" data-sev="warning">Avert. <span data-sevcount="warning">0</span></button>
        <button type="button" class="sev-filter" data-sev="opportunity">Opport. <span data-sevcount="opportunity">0</span></button>
      </div>

      <span class="active-filter" id="active-filter" hidden>
        Filtre : <strong id="active-filter-label"></strong>
        <button type="button" id="active-filter-clear" title="Retirer le filtre">x</button>
      </span>

      <!-- Sélection multiple de lignes (clic, Shift+clic, Ctrl+clic) -> copie des adresses -->
      <span class="multi-sel" id="multi-sel" hidden>
        <strong id="multi-sel-count">0</strong> cellule(s) &middot; <span id="multi-sel-col"></span>
        <button type="button" id="multi-sel-copy" title="Copier les valeurs sélectionnées, une par ligne (Ctrl+C ou clic droit)">Copier</button>
        <button type="button" id="multi-sel-clear" class="multi-sel-x" title="Désélectionner (Échap)">x</button>
      </span>

      <!-- Selecteur de vue : visible seulement sur l'onglet Sitemap -->
      <span class="sitemap-views" id="sitemap-views" hidden>
        <label for="sitemap-view">Vue</label>
        <select id="sitemap-view" class="mini-select">
          <option value="all">Toutes les URLs du sitemap</option>
          <option value="orphan">Orphelines (dans le sitemap, non crawlées)</option>
          <option value="notin">Pages hors sitemap</option>
        </select>
      </span>

      <span class="gridtools-spacer"></span>

      <!-- Menu Export en masse (toutes pages, hors filtre courant) -->
      <div class="menu" id="menu-bulk">
        <button type="button" class="btn btn--ghost btn--sm menu-btn">Export en masse &#9662;</button>
        <div class="menu-list" id="menu-bulk-list">
          <button type="button" class="menu-item" data-export="links">Tous les liens</button>
          <button type="button" class="menu-item" data-export="images">Toutes les images</button>
          <button type="button" class="menu-item" data-export="issues">Tous les problèmes</button>
        </div>
      </div>

      <!-- Menu Rapports de synthese -->
      <div class="menu" id="menu-report">
        <button type="button" class="btn btn--ghost btn--sm menu-btn">Rapports &#9662;</button>
        <div class="menu-list" id="menu-report-list">
          <button type="button" class="menu-item" data-report="redirects">Chaînes de redirection</button>
          <button type="button" class="menu-item" data-report="canonicals">Canonicals</button>
          <button type="button" class="menu-item" data-report="nonindex">Pages non-indexables</button>
          <button type="button" class="menu-item" data-report="mixed">Contenu mixte</button>
        </div>
      </div>

      <button type="button" id="btn-export-csv" class="btn btn--ghost btn--sm">Export CSV</button>
    </div>

    <!-- ----- 3) + 4) ESPACE DE TRAVAIL : grille + sidebar Overview ------- -->
    <div class="workspace">
      <!-- GRILLE DENSE plein largeur -->
      <main class="gridwrap">
        <!-- Bandeau d'information contextuel (ex: near-dup désactivé si trop de pages) -->
        <div class="grid-banner" id="grid-banner" hidden></div>
        <table class="grid" id="grid">
          <thead id="grid-head"></thead>
          <tbody id="grid-body"></tbody>
        </table>
        <div class="grid-empty" id="grid-empty">Lancez un crawl pour voir les résultats ici.</div>
      </main>

      <!-- SIDEBAR DROITE : arborescence Overview avec compteurs -->
      <aside class="overview" id="overview">
        <div class="overview-head">Overview</div>
        <div class="overview-tree" id="overview-tree"></div>
      </aside>
    </div>

    <!-- ----- 5) PANNEAU DE DÉTAIL (au clic sur une ligne) --------------- -->
    <section class="detail" id="detail" hidden>
      <!-- Poignee de redimensionnement : glisser pour agrandir le panneau,
           double-clic pour revenir à la hauteur par defaut. -->
      <div class="detail-resize" id="detail-resize"
           title="Glisser pour redimensionner — double-clic pour réinitialiser"></div>
      <div class="detail-head">
        <div class="detail-tabs" id="detail-tabs">
          <button type="button" class="dtab is-active" data-dtab="inlinks">Inlinks <span id="dt-inlinks-count">0</span></button>
          <button type="button" class="dtab" data-dtab="outlinks">Outlinks <span id="dt-outlinks-count">0</span></button>
          <!-- La LISTE des images sans alt, pas seulement leur nombre : c'est elle qu'il faut pour corriger. -->
          <button type="button" class="dtab" data-dtab="images">Images sans alt <span id="dt-images-count">0</span></button>
          <button type="button" class="dtab" data-dtab="serp">SERP Snippet</button>
          <button type="button" class="dtab" data-dtab="info">Infos / En-têtes</button>
          <!-- D) Sous-onglet dédié au contenu brut des données structurees (JSON-LD). -->
          <button type="button" class="dtab" data-dtab="schema">Données structurees <span id="dt-schema-count">0</span></button>
          <button type="button" class="dtab" data-dtab="source">Source</button>
        </div>
        <button type="button" class="detail-close" id="detail-close" title="Fermer">x</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </section>

    <!-- ----- 6) BARRE DE STATUT ----------------------------------------- -->
    <footer class="statusbar">
      <div class="statusbar-progress">
        <div class="statusbar-progress-fill" id="status-fill"></div>
      </div>
      <span class="status-item" id="status-state">En attente</span>
      <span class="status-item status-url" id="status-url" title=""></span>
      <span class="status-item">Pages : <strong id="status-done">0</strong> / <span id="status-total">0</span></span>
      <span class="status-item">File : <strong id="status-queued">0</strong></span>
      <span class="status-item">Débit : <strong id="status-rate">0</strong> p/s</span>
      <span class="status-item" id="status-workers-item" title="Workers réellement occupés / threads configurés. S'il reste bas, le goulot n'est pas le nombre de threads (plafond de débit, file vide, ou mesures Chrome serialisees).">Workers : <strong id="status-workers">0</strong>/<span id="status-threads">0</span></span>
      <span class="status-item">Resp. moy. : <strong id="status-avgms">0</strong> ms/page</span>
      <span class="status-item">Poids total : <strong id="status-bytes">0 o</strong></span>
      <span class="status-sep"></span>
      <span class="status-item status-item--multi" id="status-multi" hidden></span>
    </footer>

  </div>

  <!-- Menu contextuel de la grille (clic droit sur une cellule). -->
  <div class="ctx-menu" id="ctx-menu" hidden>
    <button type="button" class="ctx-item" id="ctx-copy">Copier <span id="ctx-copy-count">0</span> valeur(s) &mdash; <span id="ctx-col-label"></span></button>
    <button type="button" class="ctx-item" id="ctx-copy-col">Copier toute la colonne affichée</button>
    <button type="button" class="ctx-item" id="ctx-open">Ouvrir l'adresse dans le navigateur</button>
  </div>

  <!-- Message flottant bref (copie effectuée, etc.). -->
  <div class="toast" id="toast" hidden></div>

  <script src="main.js"></script>
</body>
</html>
