[package]
name = "crawl-core"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["gzip", "brotli", "cookies"] }
scraper = "0.21"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
futures = "0.3"
url = "2"
governor = "0.7"
serde = { version = "1", features = ["derive"] }
# `raw_value` : relire un crawl enregistré en flux, chaque page gardant le texte
# exact du fichier (`savedcrawl`). Déjà activée dans l'application par Tauri.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
