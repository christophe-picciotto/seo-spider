[package]
name = "crawl-core"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["gzip", "brotli", "cookies"] }
scraper = "0.21"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
futures = "0.3"
url = "2"
governor = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
